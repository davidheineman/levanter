# Example configuration for Collapse training with Llama
#
# Collapse enables predictable loss curves across model scales by fixing:
# - TPP (tokens-per-parameter): determines training duration
# - τ (tau): AdamW timescale, determines weight decay
#
# Usage:
#   # In your training script, compute the training params:
#   from levanter.optim import CollapseConfig, estimate_params_from_config
#
#   collapse = CollapseConfig(tpp=20.0, tau=0.05)
#   num_params = estimate_params_from_config(config.model, vocab_size)
#   params = collapse.compute_training_params(
#       num_params=num_params,
#       batch_size=config.trainer.train_batch_size,
#       seq_len=config.model.seq_len,
#       learning_rate=config.optimizer.learning_rate,
#   )
#   # Then set: trainer.num_train_steps = params.num_train_steps
#   #           optimizer.weight_decay = params.weight_decay
#
# The training budget is computed as:
#   total_tokens = tpp × num_params
#   num_steps = total_tokens / (batch_size × seq_len)
#   weight_decay = batch_size / (tau × lr × total_tokens)

# Model configuration
model:
  type: llama
  hidden_dim: 768
  intermediate_dim: 2048
  num_heads: 12
  num_kv_heads: 12
  num_layers: 12
  seq_len: 2048
  use_mup: true  # Recommended for width scaling

# Data configuration
data:
  train_urls:
    - "gs://your-bucket/data/train.{1..128}-of-128.jsonl.gz"
  validation_urls:
    - "gs://your-bucket/data/val.{1..8}-of-8.jsonl.gz"
  cache_dir: "gs://your-bucket/tokenized/collapse_train/"
  tokenizer: "NousResearch/Llama-2-7b-hf"

# Trainer configuration
trainer:
  tracker:
    - type: wandb
      project: "collapse-scaling"
      tags: ["collapse", "mup"]

  mp: p=f32,c=bfloat16
  model_axis_size: 1
  per_device_parallelism: -1
  train_batch_size: 256

  # NOTE: num_train_steps should be set programmatically from CollapseConfig
  # For a 125M param model with TPP=20, batch=256, seq=2048:
  #   total_tokens = 20 * 125M = 2.5B
  #   num_steps = 2.5B / (256 * 2048) = 4768
  num_train_steps: 4768

# Optimizer configuration
optimizer:
  type: adam
  learning_rate: 1.0e-3
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  max_grad_norm: 1.0
  use_mup: true

  # NOTE: weight_decay should be set programmatically from CollapseConfig
  # For tau=0.05, batch=256*2048, lr=1e-3, total_tokens=2.5B:
  #   weight_decay = (256*2048) / (0.05 * 1e-3 * 2.5B) ≈ 4.19
  # This is high because it's the "decoupled" form - effective decay is lr * weight_decay
  weight_decay: 4.19
  decoupled_weight_decay: true

  # Use warmup/cooldown fractions matching Collapse schedule
  warmup: 0.01        # 1% warmup
  min_lr_ratio: 0.1   # Decay to 10% of peak
